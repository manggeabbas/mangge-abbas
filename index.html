  <style>

    body {

      justify-content: center;
      gap: 10px;
      text-decoration: none;
      margin: 10px 0;
      padding: 14px;
      border-radius: 10px;
      font-weight: 500;
      transition: 0.3s;
      color: white;
    }

    .btn i {
      font-size: 18px;
    }

    .email { background: #EA4335; }
    .ig {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
    }

    .btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #ccc;
